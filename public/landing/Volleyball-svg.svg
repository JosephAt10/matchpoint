<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.5)"/>
      <stop offset="60%" stop-color="rgba(0, 0, 0, 0.1)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <radialGradient id="ballGradient" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fdfdfd"/>
      <stop offset="85%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#d9d9d9"/>
    </radialGradient>

    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="ballClip">
      <circle cx="250" cy="250" r="200" />
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="#fcfcfc"/>

  <ellipse cx="250" cy="460" rx="160" ry="25" fill="url(#floorShadow)" />

  <g clip-path="url(#ballClip)">
    <circle cx="250" cy="250" r="200" fill="url(#ballGradient)" />

    <g fill="none" stroke="#222222" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 50,250 Q 250,265 450,250" />
      <path d="M 50,210 Q 250,225 450,210" />
      <path d="M 50,290 Q 250,305 450,290" />
      <path d="M 50,170 Q 250,185 450,170" />
      <path d="M 50,330 Q 250,345 450,330" />

      <path d="M 170,55 Q 250,250 170,445" />
      <path d="M 330,55 Q 250,250 330,445" />
      
      <path d="M 120,80 Q 250,20 380,80" />
      <path d="M 170,120 Q 250,70 330,120" />

      <path d="M 120,420 Q 250,480 380,420" />
      <path d="M 170,380 Q 250,430 330,380" />

      <path d="M 50,250 Q 110,210 110,130 Q 110,50 170,55" />
      <path d="M 450,250 Q 390,210 390,130 Q 390,50 330,55" />
      <path d="M 50,250 Q 110,290 110,370 Q 110,450 170,445" />
      <path d="M 450,250 Q 390,290 390,370 Q 390,450 330,445" />
    </g>

    <circle cx="230" cy="310" r="2.5" fill="#333333"/>
    <ellipse cx="230" cy="310" rx="3" ry="1" fill="#eeeeee" transform="rotate(-30, 230, 310)"/>

    <g transform="translate(250, 250) scale(1.0, 1.05)">
      <circle r="40" fill="none" stroke="#000000" stroke-width="1.8"/>
      
      <g fill="none" stroke="#000000" stroke-width="1.2">
        <path d="M -30,-20 Q 0,-5 30,-20" />
        <path d="M -35,0 Q 0,15 35,0" />
        <path d="M -30,20 Q 0,35 30,20" />
        <path d="M 0,-35 Q -10,-10 0,-5 Q 10,-10 0,-35" />
      </g>

      <defs>
        <path id="logoTextPath" d="M -45,10 A 45,45 0 0,0 45,10"/>
      </defs>
      <text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#000000" letter-spacing="0.1em">
        <textPath href="#logoTextPath" startOffset="50%" text-anchor="middle">VOLLEYBALL</textPath>
      </text>

      <defs>
        <path id="infoTextPath" d="M -38,-15 A 38,38 0 0,1 38,-15"/>
      </defs>
      <text font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#000000" letter-spacing="0.1em">
        <textPath href="#infoTextPath" startOffset="50%" text-anchor="middle">OFFICIAL SIZE 5</textPath>
      </text>
    </g>

    <circle cx="250" cy="250" r="200" fill="url(#glossHighlight)" />
  </g>

  <circle cx="250" cy="250" r="199.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
