<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.5)"/>
      <stop offset="60%" stop-color="rgba(0, 0, 0, 0.2)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <radialGradient id="tennisBase" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ccff33"/>
      <stop offset="40%" stop-color="#bbff00"/>
      <stop offset="70%" stop-color="#aaee00"/>
      <stop offset="100%" stop-color="#88cc00"/>
    </radialGradient>

    <radialGradient id="sphereShadow" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>

    <filter id="recessedSeam" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#77aa00" flood-opacity="0.7"/>
    </filter>

    <filter id="fuzzyFelt" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#ccff33" surfaceScale="0.8" result="light">
        <feDistantLight azimuth="50" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" result="blend"/>
    </filter>

    <clipPath id="ballClip">
      <circle cx="200" cy="200" r="160" />
    </clipPath>
  </defs>

  <ellipse cx="200" cy="370" rx="130" ry="18" fill="url(#floorShadow)" />

  <g clip-path="url(#ballClip)">
    <circle cx="200" cy="200" r="160" fill="url(#tennisBase)" filter="url(#fuzzyFelt)" />

    <path d="M 60,140 Q 200,60 340,140 Q 380,240 280,300 Q 200,340 120,300 Q 20,240 60,140" 
          fill="none" stroke="#f0f0f0" stroke-width="11" stroke-linecap="round" stroke-dasharray="0 15 15 0"
          filter="url(#recessedSeam)" />
    
    <circle cx="200" cy="200" r="158" stroke="#ffffff" stroke-width="2" opacity="0.15" />

    <circle cx="200" cy="200" r="160" fill="url(#sphereShadow)" style="mix-blend-mode: multiply;" />

    <ellipse cx="160" cy="110" rx="90" ry="45" transform="rotate(-15, 160, 110)" fill="#ffffff" opacity="0.2" />
  </g>

  <circle cx="200" cy="200" r="159.5" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.3"/>
</svg>
