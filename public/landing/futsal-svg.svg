<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.6)"/>
      <stop offset="60%" stop-color="rgba(0, 0, 0, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <radialGradient id="sphereShading" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#888888" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>

    <linearGradient id="surfaceGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="whitePanel" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#dadada"/>
    </radialGradient>

    <linearGradient id="futsalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#002266"/>
    </linearGradient>

    <linearGradient id="futsalGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#009977"/>
    </linearGradient>

    <filter id="seamDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <clipPath id="ballClip">
      <circle cx="200" cy="200" r="160" />
    </clipPath>
  </defs>

  <ellipse cx="200" cy="375" rx="135" ry="22" fill="url(#groundShadow)" />

  <g clip-path="url(#ballClip)">
    <circle cx="200" cy="200" r="160" fill="#dadada" />

    <g stroke="#222222" stroke-width="2" stroke-linejoin="round" filter="url(#seamDepth)">
      
      <path d="M 160,140 Q 200,110 240,140 Q 260,190 230,230 Q 170,240 140,190 Z" fill="url(#whitePanel)" />
      
      <path d="M 240,140 Q 290,110 330,150 Q 340,210 290,240 Q 260,190 240,140 Z" fill="url(#whitePanel)" />
      <path d="M 160,140 Q 110,110 70,150 Q 60,210 110,240 Q 140,190 160,140 Z" fill="url(#whitePanel)" />
      <path d="M 140,190 Q 170,240 200,290 Q 140,330 100,290 Q 110,240 140,190 Z" fill="url(#whitePanel)" />
      <path d="M 230,230 Q 170,240 200,290 Q 260,330 300,290 Q 290,240 230,230 Z" fill="url(#whitePanel)" />
      <path d="M 160,140 Q 200,110 240,140 Q 250,70 200,50 Q 150,70 160,140 Z" fill="url(#whitePanel)" />

      <path d="M 70,150 Q 40,100 90,60 Q 130,80 160,140 Z" fill="url(#whitePanel)" />
      <path d="M 330,150 Q 360,100 310,60 Q 270,80 240,140 Z" fill="url(#whitePanel)" />
      <path d="M 70,150 Q 30,220 70,280 Q 110,240 110,240 Z" fill="url(#whitePanel)" />
      <path d="M 330,150 Q 370,220 330,280 Q 290,240 290,240 Z" fill="url(#whitePanel)" />
    </g>

    <g stroke="none" opacity="0.9">
      <path d="M 165,145 Q 200,125 235,145 Q 220,180 180,175 Z" fill="url(#futsalBlue)" />
      <path d="M 175,150 Q 200,135 225,150 Q 215,170 190,165 Z" fill="url(#futsalGreen)" />
      
      <path d="M 240,235 Q 275,245 285,280 Q 255,275 245,250 Z" fill="url(#futsalBlue)" />
      <path d="M 248,242 Q 270,250 275,272 Q 258,268 252,252 Z" fill="url(#futsalGreen)" />

      <path d="M 135,185 Q 105,195 85,165 Q 105,165 120,175 Z" fill="url(#futsalBlue)" />
      <path d="M 125,182 Q 105,188 95,172 Q 108,172 118,178 Z" fill="url(#futsalGreen)" />
    </g>

    <g fill="#111111" font-family="Arial, sans-serif" text-anchor="middle" font-weight="900">
      <text x="202" y="207" font-size="15" letter-spacing="2" transform="rotate(-5, 200, 205)" fill="#001133">FUTSAL</text>
      <text x="201" y="217" font-size="6" font-weight="bold" letter-spacing="1" fill="#666666">OFFICIAL MATCH BALL</text>
      <text x="201" y="224" font-size="5" font-weight="bold" fill="#009977">SIZE 4 • LOW BOUNCE</text>
    </g>

    <circle cx="200" cy="200" r="160" fill="url(#sphereShading)" style="mix-blend-mode: multiply;" />

    <ellipse cx="165" cy="95" rx="85" ry="38" transform="rotate(-20, 165, 95)" fill="url(#surfaceGloss)" />
  </g>

  <circle cx="200" cy="200" r="159.2" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
</svg>
