<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="frameVol" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#888888" stop-opacity="0.05"/>
      <stop offset="90%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </radialGradient>

    <linearGradient id="shaftCol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#666666"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>

    <pattern id="gripPat" x="0%" y="0%" width="10%" height="10%">
      <rect x="0" y="0" width="100%" height="100%" fill="#444"/>
      <line x1="0" y1="100%" x2="100%" y2="0" stroke="#222" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.6)"/>
      <stop offset="60%" stop-color="rgba(0, 0, 0, 0.25)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <clipPath id="headClip">
      <ellipse cx="250" cy="120" rx="90" ry="110"/>
    </clipPath>
  </defs>

  <ellipse cx="250" cy="485" rx="150" ry="25" fill="url(#groundShadow)"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    
    <rect x="220" y="380" width="60" height="90" fill="url(#gripPat)" stroke="#111" stroke-width="1.5" rx="5" ry="5"/>
    <ellipse cx="250" cy="380" rx="30" ry="5" fill="#222"/>
    <path d="M 220,470 L 280,470 L 275,475 L 225,475 Z" fill="#222"/> <rect x="245" y="160" width="10" height="220" fill="url(#shaftCol)" stroke="#111" stroke-width="1.5"/>
    
    <rect x="245" y="160" width="10" height="20" fill="#222"/>
    <text x="250" y="250" fill="#dfb140" font-family="Arial, sans-serif" font-size="8" font-weight="900" transform="rotate(-90, 250, 250)">PRO RACKET</text>
    <text x="250" y="270" fill="#fcfcfc" font-family="Arial, sans-serif" font-size="6" font-weight="bold" transform="rotate(-90, 250, 270)">HIGH MODULUS GRAPHITE • SIZE: G5</text>
    <text x="250" y="290" fill="#00ffcc" font-family="Arial, sans-serif" font-size="5" font-weight="bold" transform="rotate(-90, 250, 290)">BALANCE: HEAD HEAVY</text>

