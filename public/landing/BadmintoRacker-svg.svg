        <line x1="160" y1="20" x2="340" y2="20"/><line x1="160" y1="30" x2="340" y2="30"/><line x1="160" y1="40" x2="340" y2="40"/><line x1="160" y1="50" x2="340" y2="50"/>
        <line x1="160" y1="60" x2="340" y2="60"/><line x1="160" y1="70" x2="340" y2="70"/><line x1="160" y1="80" x2="340" y2="80"/><line x1="160" y1="90" x2="340" y2="90"/>
        <line x1="160" y1="100" x2="340" y2="100"/><line x1="160" y1="110" x2="340" y2="110"/><line x1="160" y1="120" x2="340" y2="120"/><line x1="160" y1="130" x2="340" y2="130"/>
        <line x1="160" y1="140" x2="340" y2="140"/><line x1="160" y1="150" x2="340" y2="150"/><line x1="160" y1="160" x2="340" y2="160"/><line x1="160" y1="170" x2="340" y2="170"/>
        <line x1="160" y1="180" x2="340" y2="180"/><line x1="160" y1="190" x2="340" y2="190"/><line x1="160" y1="200" x2="340" y2="200"/><line x1="160" y1="210" x2="340" y2="210"/><line x1="160" y1="220" x2="340" y2="220"/>
        
        <line x1="160" y1="10" x2="160" y2="230"/><line x1="170" y1="10" x2="170" y2="230"/><line x1="180" y1="10" x2="180" y2="230"/><line x1="190" y1="10" x2="190" y2="230"/>
        <line x1="200" y1="10" x2="200" y2="230"/><line x1="210" y1="10" x2="210" y2="230"/><line x1="220" y1="10" x2="220" y2="230"/><line x1="230" y1="10" x2="230" y2="230"/>
        <line x1="240" y1="10" x2="240" y2="230"/><line x1="250" y1="10" x2="250" y2="230"/><line x1="260" y1="10" x2="260" y2="230"/><line x1="270" y1="10" x2="270" y2="230"/>
        <line x1="280" y1="10" x2="280" y2="230"/><line x1="290" y1="10" x2="290" y2="230"/><line x1="300" y1="10" x2="300" y2="230"/><line x1="310" y1="10" x2="310" y2="230"/>
        <line x1="320" y1="10" x2="320" y2="230"/><line x1="330" y1="10" x2="330" y2="230"/><line x1="340" y1="10" x2="340" y2="230"/>
