      <circle cx="160" cy="120" r="1"/><circle cx="340" cy="120" r="1"/>
      <circle cx="205" cy="45" r="1"/><circle cx="295" cy="45" r="1"/>
      <circle cx="205" cy="195" r="1"/><circle cx="295" cy="195" r="1"/>
    </g>

