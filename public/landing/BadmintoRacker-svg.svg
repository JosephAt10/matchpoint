    <ellipse cx="250" cy="120" rx="90" ry="110" fill="none" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="250" cy="120" rx="92" ry="112" fill="none" stroke="url(#frameVol)" stroke-width="2.5" style="mix-blend-mode: multiply;"/>
    
    <ellipse cx="170" cy="50" rx="80" ry="25" transform="rotate(-30, 170, 50)" fill="#ffffff" opacity="0.3"/>
